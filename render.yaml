# Render static site config for Tatoo Slot
# https://render.com/docs/reference/blueprint-spec
#
# The built artifacts live in `dist/` (committed to the repo).
# Render serves them as a static site.

services:
  - type: web
    name: tatoo-slot
    env: static
    branch: main
    publicPath: dist
    plan: free
    region: oregon
    autoPublish: true